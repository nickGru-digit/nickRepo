<!DOCTYPE html>
<html>
    <head>
        <title>GrundmanTown</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <link rel="icon" href="images/shark.jpg" type="image/jpg">
    </head>
    <body>
        <div class="header">  
            <div class="bigText">
                <img class="fire" src="images/fire.gif" alt="FIRE!!!!"/>
                <strong>Nick Grundman's Very Professional Portfolio</strong>
                <img class="fire" src="images/fire.gif" alt="FIRE!!!!"/>
            </div>
            <ul class="navbar">
                <li>
                    <a href="index.html">home</a>
                </li>
                <li>
                    <a href="gallery.html">gallery</a>
                </li>
                <li>
                    <a href="projects.html">projects</a>
                </li>
                <li>
                    <a href="joy.html">joy</a>
                </li>
                <li>
                    <a href="whimsy.html">whimsy</a>
                </li>
            </ul>
        </div>
        <div class="center">
            <img id="jumping" onclick="jump()" src="images/jumping.png"
                alt="topdown photo of a trampoline from far away" />
            <p>
                <a href="whimsy.html">Stop having fun</a>
            </p>
        </div>
        <div>
            <div class="loading"></div>
            <div class="bubbles"></div>
            <div class="loadBar"></div>
            <div class="scan-bar">
                <div class="scan"></div>
            </div>
            <div class="screen"></div>
            <div class="bezel"></div>
            <div class="glow"></div>
            <div class="cursor" id="main"></div>
        </div>
        <footer>
            <div class="footer">
                <p>© 2025 Nicky G, Shmorple Inc.</p>
            </div>
        </footer>
        <script>
            var jumping = false;
            const boingSound = new Audio("images/boing.mp3");
            function jump() {
                trampoline = document.getElementById("jumping");
                trampoline.style.transition = "transform 1.25s ease";
                if (jumping == false) 
                { 
                    jumping = true;
                    boingSound.play();
                    trampoline.style.transform = "scale(1.5)";
                    setTimeout(() => {trampoline.style.transform = "scale(0.25)";}, 400);
                    setTimeout(() => {trampoline.style.transform = "scale(1)";}, 1700);
                    setTimeout(() => {jumping = false;}, 2500);
                }
            }
        </script>
        <script src ="script.js"></script>
    </body>
</html>
