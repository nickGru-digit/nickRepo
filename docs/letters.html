            <figure class=display>
                <img src="images/firstletter.png" />
                <figcaption>Letter reads: "Dear Hallë Tikvah, I am writing to you from my new
                    writing desk on the thirteenth floor of my new apartment in Jujul City. I have
                    spent a week at the new firm and can say that the people in the city move much
                    faster than back in the country. Quite literally faster! Feet move quicker in
                    the city than in the country. I'm sure my pace will quicken, though. I mean, I
                    have to keep up... It's not so bad, though. I feel I have a better head-start
                    than most newcomers from the country-side. I mean, I can safely say that not
                    everyone in this office has chased an escaped goat up and down a fjord for five
                    hours in the winter, and caught the sod, no less... Anyway, I work in a big
                    office block now. There seems to be endless cubicles and desks on my floor. Less
                    than half of them are occupied at any one time, mind you. I have to walk a whole
                    minute to reach the nearest person to my desk, and it's almost a four minute
                    walk to the manager's office, which is always closed. Each worker is asked to
                    report once a week to a small room where we fill in forms. For hours and hours,
                    sometimes. So, needless to say that it's nice to be writing something other than
                    my name and ticking boxes for once. How are the goats? Are they still producing
                    milk? I will write again next week. I hope you are well. Give my love to
                    Gustavo, scratch him just under his white beard, he loves that. Love your great
                    grand niece, Gavrilla."</figcaption>
            </figure>
            <figure class="display">
                <img src="images/secondletter.png" />
                <figcaption>Letter reads: "Tikvah, I am writing to you from the brave new world. I
                    can already hear your booming laughter. You don't have to convince me that it is
                    you who is living bravely. Tell me you're not still trading cheese for bales of
                    straw...? Handmade cheese in the city costs what a plot of land would cost back
                    home. I passed a market set up by a conclave of merchants and was sure one was
                    selling your goats cheese. I could tell by the way it was wrapped, though, I
                    couldn't be certain. They could tell by the look of me I couldn't afford it, so
                    I couldn't get a closer look. But it made me think of you. I wish you had come
                    along when your brothers and I left, and that we had parted on better terms, but
                    again, I can already hear your rebuttal - 'You can not raise goats in the city!'
                    and on that point I cannot argue. I just wanted to write as you came to mind
                    recently. Remember when we would lay on the roof of the goat house and count
                    stars until we fell asleep? Well, there are few stars in the city, on account of
                    the lights and the pollution. There are few stars and even fewer pretty sights.
                    Not a lot of fresh air, or fruit, either. Though I am making the best of my new
                    life, I fear time is aging me quicker each day. Count the stars for me, Tikvah.
                    And tell them that I miss them all. My kindest sympathies, Your brother,
                    Semba."</figcaption>
            </figure>
            <figure class="display">
                <img src="images/thirdletter.png" />
                <figcaption>Letter reads: "To dear Baba Tikvah, Mama brought me to the newsagent
                    today. I got the new issue of Wormgal and Laika. It was issue #722! I will
                    always remember the comics you had in your cupboard, the same comic but it was
                    Wormgal #12 and Wormgal and Laika #2... I was so happy to see a new issue and
                    how many there have been! I didn't really follow the story much (Laika is now a
                    robot!!) but it was still very fun to read and remember the summers at the farm.
                    Mama told me to write about that we had tea with your neighbor, Malmö (the man
                    who owned the stables and always smelled of mint) he moved in to our
                    neighbourhood, into the basement of the deli. He still smells like mint. He
                    keeps telling things to Papa that make him worry. He fights with Mama while they
                    think I'm asleep. I heard them whispering last night about Dajë Tarr, saying
                    that we should never have come to the city, that it would be safer back at the
                    farm. Papa keeps mumbling that 'no where is safe, no where is safe' and Mama
                    blames Dajë Tarr for filling Papa's head with lies. Last time Dajë Tarr visited,
                    he left in a hurry, and yelled 'You would be better off digging holes and
                    sleeping in them!' at Papa and Mama. He hasn't been back since then. Anyway,
                    when I'm tired and don't want to listen anymore, I just look out my window
                    towards the factories and the smoke stacks. I had never seen a factory before
                    moving to the city. I used to think the farm was the whole world, and the city
                    seems like a different planet! Like where Wormgal is from! I miss you Baba
                    Tikvah. Bye bye Love Talm"</figcaption>
            </figure>
            <figure class="display">
                <img src="images/fourthletter.png" />
                <figcaption>Letter reads: "You asked me to write. I don't much enjoy it, but I can't
                    imagine what it's like out there. Most of my poetry goes to the paper these
                    days, but I will write something just for you; 'The city is by the sea. I used
                    to feel I was a field of wax grass, and the wind was fingers through my hair.
                    The water is so close, I feel the tides when I stand in the moonlight. I feel
                    the tides in my sleep. I was once grass and now I am the sea.' There you go...
                    The paper buys little snippets just like that for...enough to get buy. I spend
                    most of the pay on food for the children and the rest goes to whiskey. If the
                    children didn't wake me for food, I'm not sure I would ever get up. I leave them
                    with a neighbour in the evenings so I can be free to slink about the city. It's
                    dangerous but I can handle myself. They talk about the end of the world in the
                    bars. It's all anyone ever talks about, like just keeping the conversation going
                    will stop the neon glow from blinding the whole world. I'm drunk. I fell asleep
                    writing the letter you are reading so I guess it's time to put it in an
                    envelope. Be well, sister. -Rorik"</figcaption>
            </figure>
