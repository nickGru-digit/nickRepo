<!DOCTYPE html>
<html>
    <head>
        <title>GrundmanTown</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <link rel="icon" href="images/shark.jpg" type="image/jpg">
    </head>
    <body>
        <div class="header">
            <h1>
                <strong>Nick Grundman's Very Professional Portfolio</strong>
            </h1>
            <p><a href="index.html">home</a> | <a href="gallery.html">gallery</a> | <a
                    href="joy.html">joy</a> | <a href="whimsy.html">whimsy</a></p>
        </div>
        <div class="center">
            <img id="jumping" onclick="jump()" src="images/jumping.png"
                alt="topdown photo of a trampoline from far away" />
            <p>
                <a href="whimsy.html">Stop having fun</a>
            </p>
        </div>
        <footer>
            <div class="footer">
                <p>© 2025 Nicky G, Shmorple Inc.</p>
            </div>
        </footer>
        <script>
            function jump() {
                trampoline = document.getElementById("jumping");
                if (trampoline.style.transform !== "scale(0.25)") 
                { trampoline.style.transform = "scale(0.25)";
                    trampoline.style.transition = "transform 0.75s ease";
                    setTimeout(() => {
                    trampoline.style.transform = "scale(1)";
                    }, 700);
                }
            }
        </script>
    </body>
</html>
